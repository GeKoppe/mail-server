plugins {
	id 'java'
	id 'jacoco'
}

group = 'org.koppe.cuf.mail.server'
version = '1.0.0'
description = 'Backend for an epub library application'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		name = "github"
		url = 'https://maven.pkg.github.com/GeKoppe/java-expansion'
		credentials {
			username = findProperty('gpr.user') ?: System.getenv('GH_USER') ?: ''
			password = findProperty('gpr.key') ?: System.getenv('GH_KEY') ?: ''
		}
	}
}

dependencies {
	implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.slf4j:slf4j-api:2.0.17'

	implementation 'org.hibernate.orm:hibernate-core:6.5.2.Final'
	implementation 'org.postgresql:postgresql:42.7.3'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	implementation 'com.zaxxer:HikariCP:5.1.0'
	implementation 'org.mindrot:jbcrypt:0.4'
	implementation 'org.reflections:reflections:0.10.2'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.21.4'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'

	implementation 'org.koppe.java:java-expansion:0.0.2-SNAPSHOT'

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	compileOnly 'org.projectlombok:lombok:1.18.36'

    annotationProcessor 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen:6.5.2.Final'

	testImplementation 'org.mockito:mockito-core:5.12.0'
	
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
	testImplementation 'com.h2database:h2:2.1.214'
	testImplementation 'com.squareup.okio:okio:3.16.3'
	testImplementation 'com.squareup.okhttp3:okhttp:5.3.2'
	testImplementation 'uk.org.webcompere:system-stubs-jupiter:2.1.0'
	testImplementation "com.icegreen:greenmail:2.0.1"

	testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
	testAnnotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen:6.5.2.Final'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	finalizedBy jacocoTestCoverageVerification
}

jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.60
			}
		}
	}
}
